name: Winter Arc Buddy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Prisma Generate
      run: npx prisma generate

    - name: Run Typecheck
      run: npm run typecheck

    - name: Run Linter
      run: npm run lint

    - name: Run Tests
      run: npm run test

    - name: Build
      run: npm run build
      env:
        # Dummy values to allow NextAuth/Prisma builds
        DATABASE_URL: "postgresql://dummy"
        AUTH_SECRET: "dummy"
